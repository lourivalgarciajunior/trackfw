name: Gates locais do fork

# 🔴 ARQUIVO NOVO, SÓ NOSSO — de propósito.
#
# Os 7 workflows existentes são COMPARTILHADOS com o upstream (derivado por
# `git ls-tree`, não por `git cat-file`: o MSYS converte `ref:.caminho` quando o
# caminho começa com ponto, e a checagem devolve "só nosso" para arquivo que é
# dele). Acrescentar um job a qualquer um deles criaria divergência de produto
# que todo merge futuro pagaria — hoje ela é ZERO. Adição não é divergência.
#
# POR QUE `push` E `pull_request`, e nunca `workflow_dispatch`: disparo manual é
# exatamente o defeito que este workflow existe para fechar. Medido em
# 2026-09-10: 10 scripts em `scripts/` são só nossos e NENHUM era invocado por
# automação nenhuma. O `check-upstream-content.sh` ficou vermelho por semanas com
# 7 arquivos de governança do upstream em `docs/`, e só apareceu porque alguém o
# rodou à mão numa auditoria de outra REQ.
#
# Ver REQ-2026-09-10-o-check-upstream-content-nao-roda-em-lugar-nenhum.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates-locais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 Histórico completo: dois dos gates derivam por comparação com o
          # upstream. Com clone raso a ref não resolve — e eles falham FECHADOS,
          # que é o comportamento certo, mas transformaria este job num vermelho
          # permanente por motivo errado.
          fetch-depth: 0

      - name: Buscar o upstream
        # Sem isto, `upstream/main` não existe no runner e os gates que dependem
        # dela reprovam dizendo isso. Falham fechados de propósito: verde por não
        # conseguir checar seria pior.
        run: |
          git remote add upstream https://github.com/kgsaran/trackfw.git || true
          git fetch --no-tags upstream main

      - name: Identidade do git
        # 🔴 OBRIGATORIO. O check-upstream-sync-falsify exercita o
        # upstream-sync.sh, que faz `git merge --no-commit --no-ff`. Mesmo SEM
        # commitar, o git exige identidade e falha com "Committer identity
        # unknown". O runner nao traz uma; a maquina de desenvolvimento traz, e
        # por isso o gate passava local e reprovava aqui.
        #
        # Levou QUATRO camadas de stderr descartado para esta mensagem aparecer:
        # o worktree cravado em /c, o merge que ignorava o exit code, o sync que
        # descartava a saida, e o gate que descartava a do sync.
        run: |
          git config user.email "ci@localhost"
          git config user.name "CI"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 🔴 Sem setup-node, setup-python, `npm ci` e `pip install` desde 2026-09-16.
      # Existiam para o check-subcommand-parity, que invocava os CLIs de Node e
      # Python. A v8.0.0 do upstream (#365) removeu as duas reimplementacoes, o
      # gate foi retirado, e nenhum gate nosso usa mais runtime alem do Go. O
      # self-test do ratchet abaixo usa o python3 que o ubuntu-latest ja traz.
      # Ver REQ-2026-09-16-gates-so-nossos-depois-da-v8.

      - name: Compilar o binário da árvore
        # O gate mede com o binário DESTA árvore, nunca com o do PATH — um
        # `trackfw` instalado é outra instalação, e já reportou 15 violações que
        # eram zero.
        run: go build -o bin/trackfw ./cmd/trackfw

      - name: Pôr o MESMO binário no PATH, para a regra de harness do #527
        # A regra nova do upstream (PR #527, mesclada em 2026-10-06) resolve
        # `trackfw` no PATH, porque o hook passou a chamar `trackfw guard <nome>`
        # em vez do `.sh`. Sem o binário no PATH ela acusa
        # "trackfw binary not found in PATH — the hook will fail open" e o
        # `validate` sai 1 — medido neste PR, duas violações em runner limpo.
        #
        # É a forma do PRÓPRIO upstream, não invenção nossa: `trackfw-gate.yml` e
        # `trackfw-validate.yml` compilam direto para /usr/local/bin e chamam
        # `trackfw validate`. Os dois passaram no mesmo PR em que este job
        # reprovou — a diferença era só esta.
        #
        # 🔴 É o MESMO binário desta árvore, copiado. A regra de medir com o
        # binário da árvore (acima) continua valendo: não há instalação de
        # terceiro no PATH, há uma cópia do que acabou de ser compilado.
        run: sudo cp bin/trackfw /usr/local/bin/trackfw

      - name: Gates locais do fork
        run: bash scripts/run-local-gates.sh

      - name: Self-test do gate de roadmap done com ML pendente
        # O agregador acima ja exercita o caminho REAL deste gate. Este passo exercita o
        # CLASSIFICADOR — as 14 formas de status e de marca —, que o acervo de hoje nao
        # cobre: ele tem 0 acusados, entao nenhuma das formas de recusa e exercitada por ele.
        #
        # 🔴 Guarda de vacuidade sobre o denominador, pelo mesmo motivo do ratchet abaixo:
        # self-test que exercita zero caso sai 0 e pareceria verde. O gate falha sozinho se
        # forem menos de 14 casos, e este passo confere a frase do denominador.
        run: |
          set -euo pipefail
          bash scripts/check-roadmap-done-com-ml-pendente.sh --self-test | tee "$RUNNER_TEMP/rd-self-test.txt"
          grep -qE '^self-test: [1-9][0-9]* de [1-9][0-9]* caso\(s\) passaram$' "$RUNNER_TEMP/rd-self-test.txt"

      - name: Self-test do ratchet de Windows do upstream
        # 🔴 Sem este passo o self-test NAO roda em lugar nenhum do nosso CI. O `Makefile` o
        # chama no `parity-rest`, mas o nosso `parity-other-gates` morre na linha 78, antes de
        # chegar a ele (check-roadmap-barrier-contract.sh, sobre o snapshot congelado que nao
        # regeneramos).
        #
        # O script e do upstream e o arquivo e COMPARTILHADO: aqui ele so e EXECUTADO, nunca
        # editado. A divergencia de produto continua zero.
        #
        # 🔴 Guarda de vacuidade sobre o denominador: o self-test sai 0 quando nenhum caso
        # falha, e isso inclui o caso de nenhum caso rodar. Zero PASS nao e verde.
        #
        # 🔴 stop-commands: os casos sinteticos do self-test imprimem `::error::` de proposito
        # (exercitam os caminhos de erro do ratchet), e o GitHub converte cada um em anotacao.
        # Medido no run 34596903146: 10 anotacoes "failure" num job VERDE. Durante o self-test
        # os comandos ficam desligados; se ele reprovar, o passo emite UM erro, este aqui.
        #
        # Ver ROADMAP-2026-09-10-baselines-de-suite-nunca-foram-versionados, ML-1A.
        run: |
          set -o pipefail
          token="selftest-$(date +%s)-$RANDOM"
          echo "::stop-commands::${token}"
          rc=0
          python3 scripts/check-windows-known-failures.py --self-test 2>&1 | tee "$RUNNER_TEMP/ratchet-self-test.txt" || rc=$?
          echo "::${token}::"
          if [ "$rc" -ne 0 ]; then
            echo "::error::self-test do ratchet REPROVOU (exit $rc) — ver as linhas SELF-TEST FAIL acima"
            exit "$rc"
          fi
          if ! grep -qE '^Self-test summary: [1-9][0-9]* PASS, 0 FAIL$' "$RUNNER_TEMP/ratchet-self-test.txt"; then
            echo "::error::self-test do ratchet sem denominador valido: esperava 'Self-test summary: N PASS, 0 FAIL' com N > 0"
            exit 1
          fi

      - name: trackfw validate
        run: ./bin/trackfw validate

      - name: Divergência de produto tem de ser ZERO
        # O invariante do fork: arquivo COMPARTILHADO que NÓS mudamos. Adição não
        # conta — os scripts só nossos não são divergência.
        #
        # 🔴 A comparação é ancorada na BASE DE MERGE, não em `HEAD upstream/main`.
        # Medido em 2026-10-02, no PR #192: com o upstream quatro merges à frente
        # (#500, #501, #503, #506) e a nossa `main` ainda sem eles, o diff de dois
        # pontos acusou 21 arquivos compartilhados "divergentes" — e a nossa
        # divergência real era ZERO. O que o dois-pontos mede é "o upstream andou",
        # não "nós mudamos". Ancorado na base:
        #
        #   dois pontos  HEAD..upstream/main  ->  28 arquivos
        #   base..HEAD   (o que nós mudamos)  ->   1 arquivo, e ele é só nosso
        #                                          (.github/workflows/local-gates.yml)
        #
        # É a mesma armadilha de instrumento que já custou um alarme falso neste
        # fork: dois pontos contra três pontos. O gate que afirma a invariante não
        # pode ser o que a quebra quando o upstream publica.
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD upstream/main) || base=""
          if [ -z "$base" ]; then
            echo "::error::nao foi possivel resolver a base de merge com upstream/main — sem ela este gate nao mede nada"
            exit 1
          fi
          # Guarda de vacuidade: se o instrumento nao consegue ler um arquivo
          # compartilhado conhecido, "zero" seria ref quebrada, nao limpeza.
          if ! git cat-file -e "upstream/main:Makefile" 2>/dev/null; then
            echo "::error::guarda de vacuidade: upstream/main:Makefile ilegivel — refs do upstream nao chegaram"
            exit 1
          fi
          echo "base de merge: $base"
          echo "upstream/main: $(git rev-parse upstream/main)"
          adiante=$(git diff --name-only "$base" upstream/main -- internal npm pypi cmd .github Makefile | wc -l | tr -d ' ')
          echo "arquivos de produto que o upstream mudou desde a base (nao e divergencia): $adiante"
          div=0
          for f in $(git diff --name-only "$base" HEAD -- internal npm pypi cmd .github Makefile); do
            if git cat-file -e "HEAD:$f" 2>/dev/null && git cat-file -e "upstream/main:$f" 2>/dev/null; then
              echo "  DIVERGE (compartilhado, mudado por nos): $f"
              div=$((div + 1))
            fi
          done
          echo "arquivos compartilhados que diferem: $div"
          if [ "$div" -gt 0 ]; then
            echo "::error::divergencia de produto deixou de ser zero"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job de Windows: o check-platform-predicates.sh só diz algo AQUI.
  #
  # 14 das 20 linhas do corpus divergem entre `esperado` e `nativo_windows`, e a
  # linha do execbit reprovaria em `ubuntu-latest` por fato de NTFS — por isso ele
  # nunca entrou no agregador, que roda em Linux. A consequência era um gate nosso
  # que só rodava na máquina de desenvolvimento.
  #
  # O `check-orphan-gates.sh` do upstream (#409, 2026-09-23) tornou isso visível:
  # script `check-*.sh` sem consumidor REPROVA o `parity-rest`. A saída honesta é
  # dar a ele o consumidor que faltava, no sistema operacional para o qual ele
  # existe — não citá-lo em algum arquivo para o grep achar.
  # ---------------------------------------------------------------------------
  gates-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Predicados de plataforma (só faz sentido no Windows)
        run: bash scripts/check-platform-predicates.sh

      # O check-copia-do-path-esta-atras.sh compara o binário da árvore com a
      # cópia que o PATH entrega. Num runner não há `%APPDATA%/npm` nem o contorno
      # dos shims, então ele NÃO pode dizer "em dia" — e é isso que este passo
      # afirma.
      #
      # 🔴 Rodá-lo aqui só para dar consumidor ao check-orphan-gates seria o atalho
      # que o comentário acima recusa. O que este passo afirma é o AC4 da REQ:
      # premissa ausente produz **N/A nomeado**, nunca veredito. E afirma num lugar
      # onde a premissa está genuinamente ausente, em vez de num caso sintético.
      - name: Cópia do PATH — self-test, e N/A declarado onde a premissa não existe
        run: |
          bash scripts/check-copia-do-path-esta-atras.sh --self-test
          out=$(bash scripts/check-copia-do-path-esta-atras.sh)
          printf '%s\n' "$out"
          case "$out" in
            *N/A*)
              echo "ok: declarou N/A, que e o unico veredito honesto num runner sem o contorno"
              ;;
            *)
              echo "::error::o gate NAO declarou N/A num runner sem o contorno dos shims — leia a saida acima"
              exit 1
              ;;
          esac
