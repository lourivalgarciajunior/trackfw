# trackfw — configuração de governança deste repositório
#
# Este repo faz dogfooding do próprio trackfw. Os artefatos ficam namespaced por
# agente (by_agent) e o diretório de requisitos usa o nome em português, herdado
# do histórico do projeto. Ver REQ-2026-08-16-consolidar-arvores-governanca.

adr_dirs:
  - docs/adr

req_dir: docs/requisições
roadmap_dir: docs/roadmaps

roadmap_namespacing: by_agent
agents:
  - apolo
  - artemis
  - claude

governance_mode: strict
wip_limit: 1

rules:
  # Rebaixado de error para warning em 2026-08-16. O repositório não tem nenhum
  # ADR, então 5 REQs legadas travavam o gate por uma dívida que só se paga
  # escrevendo ADR retroativo. Fica visível como aviso até serem escritos.
  # Sem aspas de propósito: o parser Go (internal/config/config.go, bloco inRules)
  # não remove aspas do valor — "warning" com aspas não é reconhecido.
  req_has_adr: warning
